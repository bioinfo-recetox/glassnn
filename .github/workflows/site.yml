name: Site

# Builds the Quarto book (site root) and the Sphinx API reference (/api/),
# and deploys both to GitHub Pages from main. Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      # quarto-cli==1.10.18 is pinned by the "book" extra.
      - run: uv sync --extra docs --extra book
      - name: Build API reference
        run: uv run sphinx-build -W docs docs/_build/html
      - name: Render book (executes every chapter)
        run: uv run quarto render book
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r book/_book/. site/
          cp -r docs/_build/html site/api
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
