# The Rosetta table: where GlassNN and PyTorch differ (PLAN, decision 43).
#
# One [[row]] per difference. `glassnn` lists the GlassNN names relative to
# the package; `pytorch` and `difference` are Markdown. Book chapter 12 renders
# this file, and examples/colab_pytorch/_sync_rosetta.py copies it into the
# Colab notebooks. tests/test_rosetta.py requires a row for every docstring
# with a "Differences from PyTorch" note.

[[row]]
group = "Tensors"
glassnn = ["Tensor"]
pytorch = "`torch.Tensor`"
difference = "A float64 NumPy array is cast to the default dtype (PyTorch keeps float64). The graph is kept after `backward()`, so a second call works without `retain_graph=True`. There are no in-place operations (`+=`, item assignment); they raise an error."

[[row]]
group = "Tensors"
glassnn = ["Tensor.numpy"]
pytorch = "`torch.Tensor.numpy()`"
difference = "Returns a copy; PyTorch shares memory with the tensor."

[[row]]
group = "Tensors"
glassnn = ["backend.asarray"]
pytorch = "`torch.as_tensor`"
difference = "Floating-point input becomes the default dtype, so float64 data never mixes silently with float32 parameters."

[[row]]
group = "Device and randomness"
glassnn = ["backend.set_backend"]
pytorch = "`tensor.to(\"cuda\")`, `model.to(\"cuda\")`"
difference = "One global switch: all tensors created afterwards are on the GPU (CuPy). PyTorch places each tensor on a device."

[[row]]
group = "Device and randomness"
glassnn = ["backend.manual_seed"]
pytorch = "`torch.manual_seed`"
difference = "Returns a `numpy.random.Generator`, the same on CPU and GPU, so a seed gives identical runs on both; it is unseeded until called. PyTorch returns a `torch.Generator`, starts from a fixed seed, and draws different numbers on each device."

[[row]]
group = "Device and randomness"
glassnn = ["backend.from_dlpack", "backend.to_dlpack"]
pytorch = "`torch.from_dlpack`, `torch.utils.dlpack.to_dlpack`"
difference = "Work on arrays, not tensors: wrap the result with `Tensor(...)`, pass `tensor.data`."

[[row]]
group = "Data"
glassnn = ["data.DataLoader"]
pytorch = "`torch.utils.data.DataLoader`"
difference = "Takes the arrays `X, y` directly instead of a `Dataset`; no workers, samplers or `collate_fn`."

[[row]]
group = "Data"
glassnn = ["data.one_hot"]
pytorch = "`torch.nn.functional.one_hot`"
difference = "Lives in `glassnn.data`."

[[row]]
group = "Modules"
glassnn = ["nn.Module.state_dict"]
pytorch = "`Module.state_dict()`"
difference = "Returns copies of the values, not tensors that share memory; parameters and buffers are listed module by module."

[[row]]
group = "Modules"
glassnn = ["nn.Module.register_buffer"]
pytorch = "`Module.register_buffer(..., persistent=True)`"
difference = "No `persistent` argument: every buffer is saved."

[[row]]
group = "Layers"
glassnn = ["nn.Linear"]
pytorch = "`nn.Linear`"
difference = "Extra argument `parametrization=\"ntk\"` (NTK scaling, chapter 8); the default initialization is PyTorch's."

[[row]]
group = "Layers"
glassnn = ["nn.Conv1d", "nn.Conv2d"]
pytorch = "`nn.Conv1d`, `nn.Conv2d`"
difference = "No `groups` and no `padding_mode` (zero padding only)."

[[row]]
group = "Layers"
glassnn = ["functional.conv1d", "functional.conv2d"]
pytorch = "`F.conv1d`, `F.conv2d`"
difference = "No `groups`; zero padding only."

[[row]]
group = "Layers"
glassnn = ["functional.max_pool1d", "functional.max_pool2d", "nn.MaxPool1d", "nn.MaxPool2d"]
pytorch = "`F.max_pool1d`, `nn.MaxPool1d`, ..."
difference = "No `dilation`, `ceil_mode` or `return_indices`."

[[row]]
group = "Layers"
glassnn = ["functional.avg_pool1d", "functional.avg_pool2d", "nn.AvgPool1d", "nn.AvgPool2d"]
pytorch = "`F.avg_pool1d`, `nn.AvgPool1d`, ..."
difference = "No `ceil_mode`; padding always counts in the mean (`count_include_pad=True`)."

[[row]]
group = "Layers"
glassnn = ["nn.BatchNorm1d"]
pytorch = "`nn.BatchNorm1d`"
difference = "No `num_batches_tracked` buffer and no `momentum=None` (cumulative average)."

[[row]]
group = "Layers"
glassnn = ["nn.Dropout"]
pytorch = "`nn.Dropout`"
difference = "No `inplace` argument."

[[row]]
group = "Layers"
glassnn = ["functional.dropout"]
pytorch = "`F.dropout`"
difference = "No `inplace` argument; an extra `generator=` argument."

[[row]]
group = "Attention"
glassnn = ["functional.scaled_dot_product_attention"]
pytorch = "`F.scaled_dot_product_attention`"
difference = "A boolean mask is `True` where attention is **forbidden** (PyTorch, in this function only: `True` = allowed)."

[[row]]
group = "Attention"
glassnn = ["nn.MultiheadAttention"]
pytorch = "`nn.MultiheadAttention`"
difference = "Batch-first only, `(N, L, E)`. Three projections `q_proj`, `k_proj`, `v_proj` instead of one packed `in_proj_weight`, so `state_dict` names differ. No `kdim`, `vdim`, `add_bias_kv`, `add_zero_attn`. `is_causal=True` without a mask builds the causal mask."

[[row]]
group = "Attention"
glassnn = ["nn.TransformerEncoderLayer"]
pytorch = "`nn.TransformerEncoderLayer`"
difference = "Batch-first only. Defaults `norm_first=True` and `activation=\"gelu\"` (PyTorch: `False`, `\"relu\"`); `activation` is a string."

[[row]]
group = "Attention"
glassnn = ["nn.TransformerEncoder"]
pytorch = "`nn.TransformerEncoder`"
difference = "No `enable_nested_tensor` or `mask_check`."

[[row]]
group = "Attention"
glassnn = ["nn.PositionalEncoding"]
pytorch = "none (defined in PyTorch tutorials)"
difference = "A GlassNN module: sinusoidal, batch-first, dropout 0 by default."

[[row]]
group = "Losses"
glassnn = ["functional.cross_entropy", "nn.CrossEntropyLoss"]
pytorch = "`F.cross_entropy`, `nn.CrossEntropyLoss`"
difference = "Only `(N, C)` logits with integer targets: no class probabilities, `weight` or `ignore_index`."

[[row]]
group = "Losses"
glassnn = ["functional.mse_loss"]
pytorch = "`F.mse_loss`"
difference = "Different shapes raise an error (PyTorch broadcasts with a warning); `binary_cross_entropy_with_logits` does the same."

[[row]]
group = "Optimizers"
glassnn = ["optim.Optimizer"]
pytorch = "`torch.optim.Optimizer`"
difference = "One parameter group; the rate is `optimizer.lr` (PyTorch: `optimizer.param_groups[0][\"lr\"]`)."

[[row]]
group = "Optimizers"
glassnn = ["optim.LinearWarmup"]
pytorch = "`lr_scheduler.LinearLR(optimizer, start_factor, end_factor=1.0, total_iters=warmup_steps)`"
difference = "The same schedule under a different name; all schedulers are also in `glassnn.optim`."

[[row]]
group = "Optimizers"
glassnn = ["optim.clip_grad_norm_"]
pytorch = "`torch.nn.utils.clip_grad_norm_`"
difference = "Lives in `glassnn.optim`; Euclidean norm only."

[[row]]
group = "Tools"
glassnn = ["gradcheck.gradcheck"]
pytorch = "`torch.autograd.gradcheck`"
difference = "Checks one vector-Jacobian product with fixed weights instead of the full Jacobian, and raises an error that names the element and both values."

[[row]]
group = "Tools"
glassnn = ["analysis.empirical_ntk", "analysis.activation_stats", "analysis.count_parameters"]
pytorch = "none (`torch.func.jacrev`, forward hooks, `sum(p.numel() ...)`)"
difference = "GlassNN helpers for chapters 4 and 8; the Colab notebooks show the PyTorch equivalents."
