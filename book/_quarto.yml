project:
  type: book
  output-dir: _book
  # Run every chapter from book/, so that `from _helpers import ...` works.
  execute-dir: project

book:
  title: "GlassNN"
  subtitle: "Neural networks you can see through"
  author: "Vlad Popovici"
  repo-url: https://github.com/bioinfo-recetox/glassnn
  repo-subdir: book
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-autodiff.qmd
        - chapters/03-mlp.qmd
        - chapters/04-initialization.qmd
        - chapters/05-optimization.qmd
    - part: "Generalization"
      chapters:
        - chapters/06-regularization.qmd
        - chapters/07-memorization.qmd
        - chapters/08-ntk.qmd
    - part: "Architectures"
      chapters:
        - chapters/09-convolutions.qmd
    - references.qmd

bibliography: ../docs/references.bib
csl: assets/ieee.csl

execute:
  freeze: auto

jupyter: python3

format:
  html:
    theme: cosmo
    html-math-method: mathjax
    code-tools: false
    callout-appearance: default
    number-sections: true
